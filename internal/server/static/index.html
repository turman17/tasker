<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasker Board</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%238250df'/%3E%3Cpath d='M4 4h2v8H4zM7 4h2v5H7zM10 4h2v3h-2z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <svg class="logo" viewBox="0 0 16 16" width="24" height="24" aria-hidden="true">
      <path d="M1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25V1.75C0 .784.784 0 1.75 0ZM1.5 1.75v12.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25H1.75a.25.25 0 0 0-.25.25ZM11.75 3a.75.75 0 0 1 .75.75v7.5a.75.75 0 0 1-1.5 0v-7.5a.75.75 0 0 1 .75-.75Zm-8.25.75a.75.75 0 0 1 1.5 0v5.5a.75.75 0 0 1-1.5 0ZM8 3a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 3Z"/>
    </svg>
    <nav class="crumbs">
      <span class="muted">turman17</span>
      <span class="muted">/</span>
      <strong>tasker</strong>
    </nav>
  </header>

  <main>
    <section class="project-head">
      <div class="project-title">
        <h1>Tasker board</h1>
        <div class="progress">
          <div id="progress-bar" class="progress-bar" aria-hidden="true"></div>
          <span id="progress-text"></span>
          <button id="new-item" class="btn primary large">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M7.75 2a.75.75 0 0 1 .75.75V7h4.25a.75.75 0 0 1 0 1.5H8.5v4.25a.75.75 0 0 1-1.5 0V8.5H2.75a.75.75 0 0 1 0-1.5H7V2.75A.75.75 0 0 1 7.75 2Z"/></svg>
            New item
          </button>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" aria-selected="true">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25Zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25H4.5v-13Zm4.25 0v13h4v-13Zm5.5 0v13h2.75a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25Z"/></svg>
          Board
        </button>
      </div>
    </section>

    <section class="toolbar">
      <label class="filter">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M.75 3h14.5a.75.75 0 0 1 0 1.5H.75a.75.75 0 0 1 0-1.5ZM3 7.75A.75.75 0 0 1 3.75 7h8.5a.75.75 0 0 1 0 1.5h-8.5A.75.75 0 0 1 3 7.75Zm3 4a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"/></svg>
        <input id="filter" type="search" placeholder="Filter by keyword" autocomplete="off">
      </label>
      <span id="summary" class="muted small"></span>
    </section>

    <section id="board" class="board" aria-live="polite"></section>
  </main>

  <aside id="panel" class="panel" hidden>
    <div class="panel-backdrop" data-close></div>
    <div class="panel-body" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <div class="panel-head">
        <span id="panel-ref" class="muted small"></span>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.75.75 0 1 1 1.06 1.06L9.06 8l3.22 3.22a.75.75 0 1 1-1.06 1.06L8 9.06l-3.22 3.22a.75.75 0 0 1-1.06-1.06L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"/></svg>
        </button>
      </div>
      <h2 id="panel-title"></h2>
      <dl class="fields">
        <dt>Status</dt>
        <dd><select id="panel-status"></select></dd>
        <dt>Created</dt>
        <dd id="panel-created"></dd>
        <dt>Completed</dt>
        <dd id="panel-done"></dd>
      </dl>
      <h3 class="small muted">Description</h3>
      <p id="panel-description" class="description"></p>
      <div class="panel-actions">
        <button id="panel-delete" class="btn danger">Delete item</button>
      </div>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
